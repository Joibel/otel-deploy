# Warehouse credentials. Applied to both the `warehouse` namespace (where Postgres
# reads it via envFrom) and `default` (where the pipeline pods read it), since
# Secrets are namespaced. Same pattern as minio-secret.yaml.
apiVersion: v1
kind: Secret
metadata:
  labels:
    app: warehouse
  name: warehouse
type: Opaque
stringData:
  POSTGRES_DB: warehouse
  POSTGRES_USER: analyst
  POSTGRES_PASSWORD: analyst
