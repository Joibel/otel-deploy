apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: workflows
spec:
  mode: deployment
  # nodeSelector:
  #   core: "yes"
  # tolerations:
  #   - key: "core"
  #     operator: "Equal"
  #     value: "yes"
  #     effect: "NoSchedule"
  autoscaler:
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilization: 85
    targetMemoryUtilization: 95
  securityContext:
    runAsNonRoot: true
  resources:
    requests:
      cpu: 50m
      memory: 75Mi
  image: otel/opentelemetry-collector-contrib:0.161.0
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          # Needed for the OpenTelemetry operator's Python auto-instrumentation,
          # which can only speak http/protobuf: its injected image deliberately
          # bundles opentelemetry-exporter-otlp-proto-http and no gRPC exporter
          # ("gRPC is not appropriate for injected auto-instrumentation, where it
          # has a strict dependency on the OS / Python version"). Go components
          # (workflow-controller, argoexec) keep using gRPC on 4317.
          http:
            endpoint: "0.0.0.0:4318"
    connectors:
      spanmetrics:
        namespace: span.metrics
        dimensions:
          - name: phase
          - name: workflow
          - name: message
        histogram:
          explicit:
            buckets: [1s, 2s, 3s, 4s, 5s, 6s, 7s, 8s, 9s, 10s, 11s]
        exclude_dimensions:
          - instance
          - job
          - k8s_node_name
          - k8s_pod_name
          - service_instance_id
          - service_name
    processors:
      batch: {}
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15

    exporters:
      debug:
        verbosity: normal
        sampling_initial: 5
      prometheusremotewrite:
        endpoint: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write"
        resource_to_telemetry_conversion:
          enabled: true
        remote_write_queue:
          enabled: true
      # Tempo, queried by Grafana
      otlphttp:
        endpoint: "http://tempo.tempo.svc.cluster.local:4318/"
        tls:
          insecure: true
      # Jaeger, queried by its own UI on http://localhost:16686
      otlp/jaeger:
        endpoint: "jaeger.jaeger.svc.cluster.local:4317"
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: []
          exporters: [otlphttp, otlp/jaeger, spanmetrics]
        metrics:
          receivers: [otlp, spanmetrics]
          processors: [memory_limiter]
          exporters: [prometheusremotewrite, debug]
      telemetry:
        logs:
          level: debug
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: '0.0.0.0'
                    port: 8888
