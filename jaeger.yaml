# Jaeger v2 all-in-one. The image ships with an all-in-one config compiled in
# (memory storage, OTLP receivers on 4317/4318, UI on 16686), and the Dockerfile
# sets JAEGER_LISTEN_HOST=0.0.0.0, so it needs no config file of its own.
#
# Memory storage means traces are lost on restart. That is the right trade for a
# demo; swap in the badger or elasticsearch config for anything longer-lived.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: jaeger
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      automountServiceAccountToken: false
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.21.0
          env:
            - name: JAEGER_LISTEN_HOST
              value: "0.0.0.0"
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 16686
              name: ui
            - containerPort: 13133
              name: health
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
          readinessProbe:
            httpGet:
              path: /status
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /status
              port: 13133
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: jaeger
  labels:
    app: jaeger
spec:
  selector:
    app: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: ui
      port: 16686
      targetPort: 16686
---
# Reached on http://localhost:16686 via the k3d loadbalancer (see k3d.conf).
apiVersion: v1
kind: Service
metadata:
  name: jaeger-ui
  namespace: jaeger
  labels:
    app: jaeger
spec:
  type: NodePort
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
      nodePort: 30686
