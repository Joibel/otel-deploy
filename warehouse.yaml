# A small Postgres "data warehouse" for the data-lineage demo
# (datasci-lineage-trace.yaml).
#
# The four raw tables below are seeded with generated data. They are shaped so
# that the derived tables the pipeline builds have overlapping but non-identical
# inputs, which is what makes the lineage graph worth looking at:
#
#   orders, order_items            -> daily_revenue
#   customers, orders, order_items -> customer_ltv
#   daily_revenue, customer_ltv    -> exec_summary
#
# Credentials live in warehouse-secret.yaml, which deploy.sh applies to both this
# namespace and `default` (Secrets are namespaced and the pipeline runs in
# `default`).
apiVersion: v1
kind: ConfigMap
metadata:
  name: warehouse-seed
  namespace: warehouse
data:
  # Anything in /docker-entrypoint-initdb.d/ is run by the postgres image on
  # first start, against an empty data directory.
  01-schema.sql: |
    CREATE TABLE customers (
      customer_id  int PRIMARY KEY,
      name         text NOT NULL,
      country      text NOT NULL,
      signed_up_on date NOT NULL
    );

    CREATE TABLE products (
      product_id int PRIMARY KEY,
      name       text NOT NULL,
      category   text NOT NULL,
      list_price numeric(10,2) NOT NULL
    );

    CREATE TABLE orders (
      order_id    int PRIMARY KEY,
      customer_id int NOT NULL REFERENCES customers(customer_id),
      ordered_at  date NOT NULL,
      status      text NOT NULL
    );

    CREATE TABLE order_items (
      order_item_id int PRIMARY KEY,
      order_id      int NOT NULL REFERENCES orders(order_id),
      product_id    int NOT NULL REFERENCES products(product_id),
      quantity      int NOT NULL,
      unit_price    numeric(10,2) NOT NULL
    );

  02-seed.sql: |
    -- Deterministic seed so the demo produces the same numbers every time.
    SELECT setseed(0.42);

    INSERT INTO customers (customer_id, name, country, signed_up_on)
    SELECT i,
           'Customer ' || i,
           (ARRAY['GB','US','DE','FR','ES'])[1 + (i % 5)],
           DATE '2024-01-01' + (i % 365)
    FROM generate_series(1, 200) AS i;

    INSERT INTO products (product_id, name, category, list_price)
    SELECT i,
           'Product ' || i,
           (ARRAY['widget','gadget','doohickey'])[1 + (i % 3)],
           round((5 + (i % 40))::numeric, 2)
    FROM generate_series(1, 40) AS i;

    INSERT INTO orders (order_id, customer_id, ordered_at, status)
    SELECT i,
           1 + (i % 200),
           DATE '2025-01-01' + (i % 90),
           CASE WHEN i % 17 = 0 THEN 'cancelled' ELSE 'complete' END
    FROM generate_series(1, 2000) AS i;

    -- 1-3 items per order.
    INSERT INTO order_items (order_item_id, order_id, product_id, quantity, unit_price)
    SELECT row_number() OVER (),
           o.order_id,
           1 + ((o.order_id * n) % 40),
           1 + (n % 3),
           round((5 + ((o.order_id * n) % 40))::numeric, 2)
    FROM orders o
    CROSS JOIN generate_series(1, 3) AS n
    WHERE (o.order_id + n) % 3 <> 0;

    CREATE INDEX ON order_items (order_id);
    CREATE INDEX ON orders (customer_id);
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: warehouse
  namespace: warehouse
  labels:
    app: warehouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: warehouse
  template:
    metadata:
      labels:
        app: warehouse
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:18.6-alpine
          envFrom:
            - secretRef:
                name: warehouse
          env:
            # The image refuses to initialise into a non-empty dir, and the
            # mounted volume has a lost+found, so keep PGDATA in a subdirectory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: seed
              mountPath: /docker-entrypoint-initdb.d
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          readinessProbe:
            exec:
              command: [sh, -c, "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [sh, -c, "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: seed
          configMap:
            name: warehouse-seed
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: warehouse
  namespace: warehouse
  labels:
    app: warehouse
spec:
  selector:
    app: warehouse
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
